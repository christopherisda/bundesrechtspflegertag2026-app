<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bundesrechtspflegertag 2026</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#123868,#1d5aa6);
    color:white;
    padding:30px 20px;
}

header h1{
    margin:0;
    font-size:1.8rem;
}

header p{
    margin-top:8px;
    opacity:.9;
}

main{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
}

#status{
    background:#eef4ff;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:20px;
}

.tab{
    border:none;
    background:#dfeafc;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.tab.active{
    background:#17508a;
    color:white;
}

.event{
    border-left:5px solid #17508a;
    background:#fafcff;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

.event:last-child{
    margin-bottom:0;
}

.zeit{
    color:#17508a;
    font-weight:bold;
    margin-bottom:8px;
}

.event h3{
    margin:0 0 10px;
}

.ort{
    margin-bottom:8px;
}

.tag{
    display:inline-block;
    background:#eaf3fc;
    color:#17508a;
    padding:4px 8px;
    border-radius:16px;
    font-size:.85rem;
}

.preis{
    margin-top:8px;
    color:#666;
}

.leer{
    text-align:center;
    padding:30px;
    color:#666;
}

</style>
</head>

<body>

<header>
    <h1>⚖️ Bundesrechtspflegertag 2026</h1>
    <p>Erfurt · 21.09. bis 25.09.2026</p>
</header>

<main>

<div class="card">

    <h2>📅 Veranstaltungsprogramm</h2>

    <div id="status">
        Veranstaltungen werden geladen...
    </div>

    <div class="tabs">

        <button class="tab active"
            onclick="filterDay('Alle',this)">
            Alle
        </button>

        <button class="tab"
            onclick="filterDay('Montag',this)">
            Montag
        </button>

        <button class="tab"
            onclick="filterDay('Dienstag',this)">
            Dienstag
        </button>

        <button class="tab"
            onclick="filterDay('Mittwoch',this)">
            Mittwoch
        </button>

        <button class="tab"
            onclick="filterDay('Donnerstag',this)">
            Donnerstag
        </button>

        <button class="tab"
            onclick="filterDay('Freitag',this)">
            Freitag
        </button>

    </div>

    <div id="events"></div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSyQFnRpxoLtmmado9nrE2CKlA7rfjNkaYCf5WgqQBwLoAXa2ZL4-RCL6Fqy12zaDXUGrOx2cUEDMOz/pub?gid=473122804&single=true&output=csv";

const eventsElement =
document.getElementById("events");

const statusElement =
document.getElementById("status");

let alleEvents = [];

Papa.parse(CSV_URL, {

    download:true,

    header:true,

    skipEmptyLines:true,

    transformHeader(header){
        return header.trim().toLowerCase();
    },

    complete:function(results){

        alleEvents =
        results.data.filter(
            e => e.titel && e.titel.trim() !== ""
        );

        sortiereEvents();

        statusElement.innerHTML =
            "<strong>" +
            alleEvents.length +
            " Veranstaltungen gefunden</strong>";

        renderEvents(alleEvents);
    },

    error:function(){

        statusElement.innerHTML =
            "Programm konnte nicht geladen werden.";
    }

});

function sortiereEvents(){

    alleEvents.sort(function(a,b){

        return (a.uhrzeit || "")
            .localeCompare(b.uhrzeit || "");

    });
}

function renderEvents(liste){

    eventsElement.innerHTML = "";

    if(liste.length === 0){

        eventsElement.innerHTML =
        '<div class="leer">Keine Veranstaltungen vorhanden.</div>';

        return;
    }

    liste.forEach(function(event){

        const artikel =
        document.createElement("div");

        artikel.className = "event";

        artikel.innerHTML =

        '<div class="zeit">' +

        (event.tag || "") +

        ' · ' +

        (event.uhrzeit || "") +

        '</div>' +

        '<h3>' +

        (event.titel || "") +

        '</h3>' +

        '<div class="ort">📍 ' +

        (event.ort || "") +

        '</div>' +

        '<span class="tag">' +

        (event.kategorie || "") +

        '</span>' +

        '<div class="preis">💶 ' +

        (event.preis || "") +

        '</div>' +

        '<p>' +

        (event.beschreibung || "") +

        '</p>';

        eventsElement
            .appendChild(artikel);

    });

}

function filterDay(tag,button){

    document
        .querySelectorAll(".tab")
        .forEach(t =>
            t.classList.remove("active"));

    button.classList.add("active");

    if(tag === "Alle"){

        renderEvents(alleEvents);

        statusElement.innerHTML =
            "<strong>" +
            alleEvents.length +
            " Veranstaltungen</strong>";

        return;
    }

    const gefiltert =
        alleEvents.filter(
            e => e.tag === tag
        );

    statusElement.innerHTML =
        "<strong>" +
        gefiltert.length +
        " Veranstaltungen am " +
        tag +
        "</strong>";

    renderEvents(gefiltert);
}

</script>

</body>
</html>
