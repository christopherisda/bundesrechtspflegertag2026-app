<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123868">
<title>Bundesrechtspflegertag 2026</title>
<style>
:root{--blue:#17508a;--dark:#123868;--light:#eaf3fc;--bg:#f4f7fb;--text:#202938;--muted:#667085;--border:#dce5ef;--gold:#e2a800;--shadow:0 5px 18px rgba(18,56,104,.1)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}button,a{font:inherit}
header{color:#fff;background:linear-gradient(135deg,var(--dark),#1d5aa6);padding:32px 20px 42px}.header-inner{max-width:900px;margin:auto}header h1{margin:0;font-size:clamp(1.65rem,5vw,2.35rem);line-height:1.15}header p{margin:9px 0 0;opacity:.92}.header-count{font-size:.92rem;font-weight:700}
main{max-width:900px;margin:-20px auto 0;padding:0 18px 40px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow)}h2{margin:0 0 15px;font-size:1.35rem}
.today-info{margin-bottom:12px;color:var(--dark);font-weight:700}#status{background:#eef4ff;color:#334e68;padding:12px 14px;border-radius:10px;margin-bottom:15px}#status.error{background:#fff0f0;color:#9b1c1c}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:8px}.tab{flex:0 0 auto;border:1px solid transparent;background:#dfeafc;color:#174a7d;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:700;white-space:nowrap}.tab.active{background:var(--blue);color:#fff}.tab:focus-visible{outline:3px solid rgba(23,80,138,.2)}
.event{border:1px solid var(--border);border-left:5px solid var(--blue);background:#fbfdff;border-radius:13px;padding:17px;margin-bottom:15px}.event-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.event-main{min-width:0}.zeit{color:var(--blue);font-weight:700;margin-bottom:6px}.event h3{margin:0 0 10px;font-size:1.12rem;line-height:1.3}
.favorite{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--border);border-radius:50%;background:#fff;color:#a6afbb;cursor:pointer;font-size:1.35rem}.favorite.active{color:var(--gold);background:#fff8dc;border-color:#f0cb54}
.journey-meta{display:grid;gap:7px;margin:11px 0;color:#3f4b5b}.tag{display:inline-block;background:var(--light);color:var(--blue);padding:5px 9px;border-radius:999px;font-size:.85rem;font-weight:700}.beschreibung{margin:12px 0 0;color:#3f4b5b}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border-radius:9px;border:1px solid transparent;text-decoration:none;font-weight:700;cursor:pointer}.btn-details{color:var(--blue);background:var(--light);border-color:#cbdff3}.btn-map{color:#fff;background:var(--blue)}
.details-panel{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);color:#344054;white-space:pre-line}.details-panel.open{display:block}.cost-note{margin-top:13px;color:var(--muted);font-size:.86rem}.leer{text-align:center;padding:34px 16px;color:var(--muted)}.footer-note{text-align:center;color:var(--muted);font-size:.9rem;padding:16px 12px}
@media(max-width:560px){main{padding-left:12px;padding-right:12px}.card{padding:16px}.event{padding:14px}.actions .btn{flex:1 1 140px}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>⚖️ Bundesrechtspflegertag 2026</h1><p>Erfurt · 21.09. bis 25.09.2026</p><p id="header-count" class="header-count">Programm wird geladen …</p></div></header>
<main><section class="card"><h2>📅 Veranstaltungsprogramm</h2><div id="today-info" class="today-info" hidden></div><div id="status" aria-live="polite">Veranstaltungen werden geladen …</div>
<nav class="tabs" aria-label="Programm filtern"><button class="tab active" data-day="Alle">Alle</button><button class="tab" data-day="Montag">Montag</button><button class="tab" data-day="Dienstag">Dienstag</button><button class="tab" data-day="Mittwoch">Mittwoch</button><button class="tab" data-day="Donnerstag">Donnerstag</button><button class="tab" data-day="Freitag">Freitag</button><button class="tab" data-day="Favoriten">⭐ Meine Termine</button></nav><div id="events"></div></section><div class="footer-note">Änderungen im veröffentlichten Events-Blatt werden beim erneuten Laden übernommen.</div></main>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
"use strict";
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSyQFnRpxoLtmmado9nrE2CKlA7rfjNkaYCf5WgqQBwLoAXa2ZL4-RCL6Fqy12zaDXUGrOx2cUEDMOz/pub?gid=473122804&single=true&output=csv";
const eventsEl=document.getElementById("events"),statusEl=document.getElementById("status"),todayEl=document.getElementById("today-info"),countEl=document.getElementById("header-count"),tabs=document.querySelectorAll(".tab");
const dayOrder={Montag:1,Dienstag:2,Mittwoch:3,Donnerstag:4,Freitag:5};let allEvents=[],activeFilter="Alle";
tabs.forEach(b=>b.addEventListener("click",()=>filterDay(b.dataset.day,b)));
if(typeof Papa==="undefined")showError("Die CSV-Bibliothek konnte nicht geladen werden.");else loadEvents();
function loadEvents(){Papa.parse(CSV_URL,{download:true,header:true,skipEmptyLines:true,transformHeader:h=>String(h||"").trim().toLowerCase(),complete:r=>{allEvents=r.data.map(normalize).filter(e=>e.titel);sortEvents();if(!allEvents.length){showError("Keine Veranstaltungen erkannt.");render([]);return}countEl.textContent=allEvents.length+" Veranstaltungen · 5 Veranstaltungstage";activateInitialDay()},error:e=>{console.error(e);showError("Das Programm konnte nicht geladen werden.")}})}
function normalize(e){const n={};Object.keys(e||{}).forEach(k=>n[String(k).trim().toLowerCase()]=String(e[k]||"").trim());return{id:n.id||fallbackId(n),tag:n.tag||"",datum:n.datum||"",uhrzeit:n.uhrzeit||"",dorint_start:n.dorint_start||"",titel:n.titel||"",ort:n.ort||"",kategorie:n.kategorie||"",preis:n.preis||"",beschreibung:n.beschreibung||"",details:n.details||"",maps_link:n.maps_link||""}}
function fallbackId(e){return[e.tag,e.uhrzeit,e.titel].join("-").toLowerCase().replace(/[^a-z0-9äöüß]+/gi,"-").replace(/^-|-$/g,"")}
function sortEvents(){allEvents.sort((a,b)=>(dayOrder[a.tag]||99)-(dayOrder[b.tag]||99)||minutes(a.uhrzeit)-minutes(b.uhrzeit))}
function minutes(t){const m=String(t||"").match(/(\d{1,2})[:.]?(\d{2})?/);return m?Number(m[1])*60+Number(m[2]||0):9999}
function render(list){eventsEl.replaceChildren();if(!list.length){const d=document.createElement("div");d.className="leer";d.textContent=activeFilter==="Favoriten"?"Du hast noch keine Termine als Favorit markiert.":"Für diese Auswahl sind keine Veranstaltungen vorhanden.";eventsEl.appendChild(d);return}list.forEach(e=>eventsEl.appendChild(card(e)))}
function card(e){const a=document.createElement("article");a.className="event";const top=document.createElement("div");top.className="event-top";const main=document.createElement("div");main.className="event-main";const time=document.createElement("div");time.className="zeit";time.textContent=[e.tag,e.datum,e.uhrzeit&&"Beginn "+clock(e.uhrzeit)].filter(Boolean).join(" · ");const title=document.createElement("h3");title.textContent=e.titel;main.append(time,title);const fav=document.createElement("button");fav.type="button";fav.className="favorite";fav.textContent="★";fav.title="Termin merken";fav.setAttribute("aria-label","Termin als Favorit markieren");setFavState(fav,e.id);fav.addEventListener("click",()=>toggleFav(e.id,fav));top.append(main,fav);a.appendChild(top);
const journey=document.createElement("div");journey.className="journey-meta";if(e.dorint_start){const d=document.createElement("div");d.textContent="🏨 Start am Dorint: "+clock(e.dorint_start);journey.appendChild(d)}if(e.ort){const l=document.createElement("div");l.textContent="📍 "+e.ort;journey.appendChild(l)}if(journey.childNodes.length)a.appendChild(journey);
if(e.kategorie){const t=document.createElement("span");t.className="tag";t.textContent=e.kategorie;a.appendChild(t)}if(e.beschreibung){const p=document.createElement("p");p.className="beschreibung";p.textContent=e.beschreibung;a.appendChild(p)}
const actions=document.createElement("div");actions.className="actions";let detailsPanel=null;if(e.details){const id="details-"+domId(e.id),btn=document.createElement("button");btn.type="button";btn.className="btn btn-details";btn.textContent="Weitere Informationen";btn.setAttribute("aria-expanded","false");detailsPanel=document.createElement("div");detailsPanel.id=id;detailsPanel.className="details-panel";detailsPanel.textContent=e.details;btn.addEventListener("click",()=>{const open=detailsPanel.classList.toggle("open");btn.setAttribute("aria-expanded",String(open));btn.textContent=open?"Informationen schließen":"Weitere Informationen"});actions.appendChild(btn)}if(safeUrl(e.maps_link)){const link=document.createElement("a");link.className="btn btn-map";link.href=e.maps_link;link.target="_blank";link.rel="noopener noreferrer";link.textContent="📍 In Google Maps öffnen";actions.appendChild(link)}if(actions.childNodes.length)a.appendChild(actions);if(detailsPanel)a.appendChild(detailsPanel);if(e.preis){const c=document.createElement("div");c.className="cost-note";c.textContent="Kostenhinweis: "+e.preis;a.appendChild(c)}return a}
function clock(v){const t=String(v||"").trim();return /uhr$/i.test(t)?t:t+" Uhr"}
function activateInitialDay(){const d=new Date(),key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");const days={"2026-09-21":"Montag","2026-09-22":"Dienstag","2026-09-23":"Mittwoch","2026-09-24":"Donnerstag","2026-09-25":"Freitag"};const day=days[key];if(day){todayEl.hidden=false;todayEl.textContent="📅 Heute: "+day+", "+germanDate(d);filterDay(day,document.querySelector('[data-day="'+day+'"]'))}else{todayEl.hidden=true;filterDay("Alle",document.querySelector('[data-day="Alle"]'))}}
function germanDate(d){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()}
function filterDay(day,button){activeFilter=day;tabs.forEach(t=>t.classList.remove("active"));button.classList.add("active");const list=day==="Alle"?allEvents:day==="Favoriten"?allEvents.filter(e=>isFav(e.id)):allEvents.filter(e=>e.tag.toLowerCase()===day.toLowerCase());statusEl.classList.remove("error");statusEl.textContent=day==="Alle"?list.length+" Veranstaltungen gefunden":day==="Favoriten"?list.length+" gemerkte Termine":list.length+" Veranstaltungen am "+day;render(list)}
function showError(m){statusEl.classList.add("error");statusEl.textContent=m}
function favKey(id){return"brt2026_favorite_"+id}function isFav(id){return localStorage.getItem(favKey(id))==="1"}function setFavState(b,id){const on=isFav(id);b.classList.toggle("active",on);b.setAttribute("aria-pressed",String(on))}function toggleFav(id,b){if(isFav(id))localStorage.removeItem(favKey(id));else localStorage.setItem(favKey(id),"1");setFavState(b,id);if(activeFilter==="Favoriten")filterDay("Favoriten",document.querySelector('[data-day="Favoriten"]'))}
function safeUrl(v){try{const u=new URL(v);return u.protocol==="https:"||u.protocol==="http:"}catch{return false}}function domId(v){return String(v||"event").replace(/[^a-zA-Z0-9_-]/g,"-")}
</script>
</body>
</html>
