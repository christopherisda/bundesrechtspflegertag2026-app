<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bundesrechtspflegertag 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 28px 20px;
      color: white;
      background: linear-gradient(135deg, #123868, #1f5d9d);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 18px;
    }

    .card {
      margin-bottom: 18px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 14px rgba(15, 35, 60, 0.09);
    }

    .card h2 {
      margin-top: 0;
    }

    #status {
      margin-bottom: 18px;
      padding: 12px;
      background: #eef4fa;
      border-radius: 8px;
      color: #526174;
    }

    .event {
      margin-bottom: 15px;
      padding: 16px;
      border: 1px solid #e1e8f0;
      border-left: 5px solid #17508a;
      border-radius: 10px;
    }

    .event:last-child {
      margin-bottom: 0;
    }

    .event h3 {
      margin: 7px 0 10px;
    }

    .event p {
      margin: 7px 0;
      line-height: 1.45;
    }

    .event-time {
      color: #17508a;
      font-weight: bold;
    }

    .tag {
      display: inline-block;
      margin-top: 7px;
      padding: 5px 9px;
      color: #174a7d;
      background: #eaf3fc;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .error {
      color: #8b1e1e !important;
      background: #fff0f0 !important;
    }
  </style>
</head>

<body>
  <header>
    <h1>⚖️ Bundesrechtspflegertag 2026</h1>
    <p>Erfurt · 21.09. bis 25.09.2026</p>
  </header>

  <main>
    <section class="card">
      <h2>Willkommen</h2>
      <p>Offizielle Veranstaltungsübersicht für Erfurt 2026.</p>
    </section>

<section class="card">
  <h2>📅 Programm</h2>

  <div id="status">
    Veranstaltungen werden geladen …
  </div>

  <div class="tabs">
    <button class="tab active" onclick="filterDay('Alle', this)">Alle</button>
    <button class="tab" onclick="filterDay('Montag', this)">Mo</button>
    <button class="tab" onclick="filterDay('Dienstag', this)">Di</button>
    <button class="tab" onclick="filterDay('Mittwoch', this)">Mi</button>
    <button class="tab" onclick="filterDay('Donnerstag', this)">Do</button>
    <button class="tab" onclick="filterDay('Freitag', this)">Fr</button>
  </div>

  <div id="events"></div>
</section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyQFnRpxoLtmmado9nrE2CKlA7rfjNkaYCf5WgqQBwLoAXa2ZL4-RCL6Fqy12zaDXUGrOx2cUEDMOz/pub?gid=473122804&single=true&output=csv";

    const statusElement = document.getElementById("status");
    const eventsElement = document.getElementById("events");

    statusElement.textContent = "Verbindung zum Programm wird hergestellt …";
    console.log("JavaScript wurde gestartet.");

    function sichererText(wert) {
      const element = document.createElement("div");
      element.textContent = wert || "";
      return element.innerHTML;
    }

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,

      transformHeader: function(header) {
        return header.trim().toLowerCase();
      },

      complete: function(results) {
        console.log("Überschriften:", results.meta.fields);
        console.log("Daten:", results.data);
        console.log("CSV-Fehler:", results.errors);

        const events = results.data.filter(function(event) {
          return event.titel && event.titel.trim() !== "";
        });

        if (events.length === 0) {
          statusElement.classList.add("error");
          statusElement.innerHTML =
            "<strong>Die Tabelle wurde geladen, aber keine Veranstaltungen wurden erkannt.</strong>" +
            "<p>Die Spalte mit den Veranstaltungstiteln muss „titel“ heißen.</p>";
          return;
        }

        statusElement.classList.remove("error");
        statusElement.textContent =
          events.length + " Veranstaltungen gefunden";

        eventsElement.innerHTML = "";

        events.forEach(function(event) {
          const article = document.createElement("article");
          article.className = "event";

          let inhalt = "";

          if (event.tag || event.uhrzeit) {
            inhalt +=
              '<div class="event-time">' +
              sichererText(event.tag) +
              (event.tag && event.uhrzeit ? " · " : "") +
              sichererText(event.uhrzeit) +
              "</div>";
          }

          inhalt += "<h3>" + sichererText(event.titel) + "</h3>";

          if (event.ort) {
            inhalt += "<p>📍 " + sichererText(event.ort) + "</p>";
          }

          if (event.preis) {
            inhalt += "<p>💶 " + sichererText(event.preis) + "</p>";
          }

          if (event.beschreibung) {
            inhalt += "<p>" + sichererText(event.beschreibung) + "</p>";
          }

          if (event.kategorie) {
            inhalt +=
              '<span class="tag">' +
              sichererText(event.kategorie) +
              "</span>";
          }

          article.innerHTML = inhalt;
          eventsElement.appendChild(article);
        });
      },

      error: function(error) {
        console.error("Ladefehler:", error);

        statusElement.classList.add("error");
        statusElement.innerHTML =
          "<strong>Das Google Sheet konnte nicht geladen werden.</strong>" +
          "<p>Bitte prüfe, ob das Events-Blatt im Web veröffentlicht ist.</p>";
      }
    });
  </script>
</body>
</html>
